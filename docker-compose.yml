# Environnement de test local pour le thème Jocelyne Bosschot.
# Usage: docker compose up -d  →  http://localhost:8080
#        Terminé:  docker compose down -v  (supprime aussi la DB)

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      # Monte le thème directement depuis ce dépôt :
      - ./:/var/www/html/wp-content/themes/jocelyne-bosschot

volumes:
  db_data:
  wp_data:
